name: Build tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Validate and stamp release version
        run: npm run version:sync
      - name: Install build dependencies
        run: npm ci
      - name: Test release versioning
        run: node --test tests/JavaScript/app-version.test.mjs
      - name: Build assets
        run: npm run build
      - name: Upload release version and assets
        uses: actions/upload-artifact@v4
        with:
          name: gso-release-${{ github.ref_name }}
          path: |
            VERSION
            public/build/
          if-no-files-found: error
